<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --accent-color: #00ff66; /* Safe green */
      --text-color: #c9d1d9;
    }
    
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      overflow: hidden;
    }

    .container {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #30363d;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    /* Animated Shield */
    .shield-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      background: var(--accent-color);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      box-shadow: 0 0 20px var(--accent-color);
      transition: all 0.5s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 24px;
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px var(--accent-color); }
      100% { transform: scale(1.05); box-shadow: 0 0 25px var(--accent-color); }
    }

    h3 { margin: 5px 0 15px; font-size: 18px; letter-spacing: 1px; }

    .setting-group {
      text-align: left;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.03);
      padding: 10px;
      border-radius: 8px;
    }

    label { display: block; font-size: 11px; color: #8b949e; margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; }

    select, input[type="checkbox"] {
      cursor: pointer;
    }

    select {
      width: 100%;
      background: #21262d;
      color: #fff;
      border: 1px solid #30363d;
      padding: 8px;
      border-radius: 6px;
      outline: none;
      transition: border 0.3s;
    }
    select:focus { border-color: var(--accent-color); }

    .switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Кнопка сброса предупреждений */
    .reset-btn {
      width: 100%;
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      margin-top: 5px;
    }
    .reset-btn:hover {
      border-color: #ff0055;
      color: #fff;
      background: rgba(255, 0, 85, 0.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="shield-icon" id="shield">✓</div>
    <h3 id="status-title">SYSTEM SECURE</h3>

    <!-- Security Level Selection -->
    <div class="setting-group">
      <label for="security-level">SECURITY LEVEL</label>
      <select id="security-level">
        <option value="low">Low (Phishing Only)</option>
        <option value="medium" selected>Medium (Optimal)</option>
        <option value="maximum">MAXIMUM (Paranoia Mode)</option>
      </select>
    </div>

    <!-- Background Operation Mode -->
    <div class="setting-group switch-container">
      <label for="bg-mode">BACKGROUND PROTECTION</label>
      <input type="checkbox" id="bg-mode" checked>
    </div>

    <!-- Reset System Actions -->
    <button class="reset-btn" id="reset-warnings-btn">Reset Hidden Warnings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
